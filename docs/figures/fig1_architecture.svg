<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 490" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="a" markerWidth="7" markerHeight="6" refX="6" refY="3" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#333"/></marker></defs>
<rect width="1200" height="490" fill="#fff"/>
<g font-size="15" fill="#111" text-anchor="middle">
<!-- input -->
<rect x="20" y="150" width="110" height="110" rx="6" fill="#eef1f4" stroke="#555"/>
<text x="75" y="198" font-weight="bold">Input image</text><text x="75" y="220">224 × 224 × 3</text>
<!-- resnet -->
<rect x="170" y="130" width="170" height="150" rx="8" fill="#dbe9f7" stroke="#2b6cb0" stroke-width="2"/>
<text x="255" y="170" font-weight="bold">ResNet-50 trunk</text><text x="255" y="193">conv1 … layer4</text><text x="255" y="216">no pooling, no FC</text><text x="255" y="246" font-size="13" fill="#2b6cb0">ImageNet pre-trained</text>
<!-- feature map -->
<rect x="380" y="150" width="120" height="110" rx="6" fill="#eef1f4" stroke="#555"/>
<text x="440" y="190" font-weight="bold">Feature map</text><text x="440" y="212">2048 × 7 × 7</text><text x="440" y="234" font-size="13">→ 49 tokens</text>
<!-- proj -->
<rect x="540" y="150" width="110" height="110" rx="8" fill="#fde8cf" stroke="#c05621" stroke-width="2"/>
<text x="595" y="192" font-weight="bold">Linear</text><text x="595" y="214">2048 → 512</text><text x="595" y="244" font-size="13" fill="#c05621">new, random init</text>
<!-- mamba -->
<rect x="690" y="100" width="230" height="210" rx="8" fill="#fde8cf" stroke="#c05621" stroke-width="2"/>
<text x="805" y="126" font-weight="bold">Bidirectional Mamba block</text>
<rect x="705" y="140" width="200" height="30" rx="4" fill="#fff" stroke="#c05621"/><text x="805" y="161" font-size="14">RMSNorm</text>
<rect x="705" y="182" width="95" height="52" rx="4" fill="#fff" stroke="#c05621"/><text x="752" y="204" font-size="13">forward</text><text x="752" y="222" font-size="13">SSM scan</text>
<rect x="810" y="182" width="95" height="52" rx="4" fill="#fff" stroke="#c05621"/><text x="857" y="204" font-size="13">backward</text><text x="857" y="222" font-size="13">SSM scan</text>
<text x="805" y="258" font-size="12">d = 512, expand 2, N = 16, conv 4</text>
<text x="805" y="278" font-size="13">+ residual connection</text>
<text x="805" y="299" font-size="13" fill="#c05621">new, random init</text>
<!-- pool -->
<rect x="960" y="150" width="110" height="110" rx="8" fill="#fde8cf" stroke="#c05621" stroke-width="2"/>
<text x="1015" y="186" font-weight="bold">RMSNorm</text><text x="1015" y="206">mean over</text><text x="1015" y="224">49 tokens</text><text x="1015" y="244">LayerNorm</text>
<!-- vector -->
<rect x="1100" y="170" width="80" height="70" rx="6" fill="#eef1f4" stroke="#555"/>
<text x="1140" y="200" font-weight="bold">512-d</text><text x="1140" y="220">feature</text>
</g>
<g stroke="#333" stroke-width="2" fill="none" marker-end="url(#a)">
<line x1="130" y1="205" x2="168" y2="205"/><line x1="340" y1="205" x2="378" y2="205"/><line x1="500" y1="205" x2="538" y2="205"/>
<line x1="650" y1="205" x2="688" y2="205"/><line x1="920" y1="205" x2="958" y2="205"/><line x1="1070" y1="205" x2="1098" y2="205"/>
<path d="M1140 240 V335"/>
</g>
<!-- heads -->
<g font-size="15" fill="#111" text-anchor="middle">

<rect x="600" y="355" width="250" height="80" rx="8" fill="#e6f4e6" stroke="#2f855a" stroke-width="2"/>
<text x="725" y="383" font-weight="bold">Head A: MLP</text><text x="725" y="405">Linear 512→256 → SiLU</text><text x="725" y="424">→ Dropout 0.3 → Linear 256→6</text>
<rect x="880" y="355" width="250" height="80" rx="8" fill="#e6f4e6" stroke="#2f855a" stroke-width="2"/>
<text x="1005" y="383" font-weight="bold">Head B: KAN</text><text x="1005" y="405">one B-spline KAN layer 512→6</text><text x="1005" y="424">G = 5, cubic, grid [−3, 3]</text>
<rect x="330" y="365" width="200" height="60" rx="8" fill="#eef1f4" stroke="#555"/>
<text x="430" y="392" font-weight="bold">6 class logits</text><text x="430" y="412" font-size="13">Medium1/2, Walnut1/2, White1/2</text>
</g>
<g stroke="#333" stroke-width="2" fill="none" marker-end="url(#a)">
<path d="M1140 335 H1005 V353"/><path d="M1140 335 H725 V353" />
<line x1="600" y1="395" x2="532" y2="395"/><path d="M1005 435 V462 H430 V427"/>
</g>
<text x="20" y="35" font-size="13" fill="#111">Only the head differs between the two hybrids;</text>
<text x="20" y="55" font-size="13" fill="#111">trunk, projection and Mamba block are shared.</text>
<g font-size="13" fill="#111"><rect x="20" y="70" width="14" height="14" fill="#dbe9f7" stroke="#2b6cb0"/><text x="40" y="82">pre-trained</text>
<rect x="125" y="70" width="14" height="14" fill="#fde8cf" stroke="#c05621"/><text x="145" y="82">newly initialised</text>
<rect x="255" y="70" width="14" height="14" fill="#e6f4e6" stroke="#2f855a"/><text x="275" y="82">head (MLP or KAN)</text></g>
</svg>
